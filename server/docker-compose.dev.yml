version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        PORT: ${PORT:-5000}
    container_name: pahadi_basera_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${PORT:-5000}
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-pahadi_basera}?schema=public}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-KK8Nx4JtNNfam07wlVsdAE8OjYPcLw2gg81R7lRJMBw}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-mH896DsqIlUjJ7MtnQxPerAwzRZ0Uh2fUQq6yHFKflK}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: pahadi_basera_db_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pahadi_basera}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pahadi_basera}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
